name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Publishing to the gh-pages branch needs write access to repo contents.
permissions:
  contents: write

# Let a running deploy finish; queue the next one so pushes to gh-pages don't race.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'cloud-native-taiwan'
    timeout-minutes: 15
    steps:
      # Don't keep the token in git config; the deploy step is given github_token directly.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable
      - name: Build website
        run: yarn build

      # Push the built site to gh-pages; the default bot identity authors the commit.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
